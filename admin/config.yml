backend:
  name: git-gateway
  branch: main

media_folder: "uploads"
public_folder: "/uploads"

collections:
  - name: "village_content"
    label: "Village content"
    files:
      - name: "site"
        label: "Village information"
        file: "site.json"
        format: "json"
        fields:
          - name: "title"
            label: "Village title"
            widget: "string"
